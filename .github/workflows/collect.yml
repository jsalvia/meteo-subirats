name: Recollir dades meteo

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recollir
        run: python3 collector/collect.py

      - name: Desar les dades
        run: |
          git config user.name "meteo-subirats bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sense canvis"
          else
            git commit -m "dades $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
